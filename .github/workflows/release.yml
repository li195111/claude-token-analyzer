name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server

      - name: Verify tag, manifests, and Rust tests
        env:
          CTA_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo test --all-targets --locked --manifest-path mcp-server/Cargo.toml

      - name: Run clippy
        run: cargo clippy --all-targets --locked --manifest-path mcp-server/Cargo.toml -- -D warnings

      - name: Verify installer contracts
        run: bash scripts/tests/install_test.sh

      - name: Build host MCP server
        run: cargo build --release --locked --manifest-path mcp-server/Cargo.toml --bin cta-mcp-server

      - name: Verify MCP stdio identity and tools
        run: node scripts/mcp-stdio-smoke.mjs -- mcp-server/target/release/cta-mcp-server

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cta-mcp-server-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cta-mcp-server-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cta-mcp-server-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: cta-mcp-server-aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        working-directory: mcp-server
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cta-mcp-server

      - name: Package binary
        run: |
          mkdir -p dist
          cp mcp-server/target/${{ matrix.target }}/release/cta-mcp-server dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum cta-mcp-server-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
